<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnFlow - AI Study Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Welcome Screen -->
        <div id="welcomeScreen" class="welcome-screen active">
            <div class="welcome-card">
                <h1 class="welcome-title">LearnFlow</h1>
                <p class="welcome-subtitle">Ask any study question to begin</p>
            </div>
        </div>

        <!-- Main Chat Interface -->
        <div id="chatInterface" class="chat-interface">
            <!-- Header -->
            <header class="header">
                <h1 class="header-title">LearnFlow</h1>
                <button id="settingsBtn" class="settings-btn" aria-label="Settings">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m2.12 2.12l4.24 4.24M1 12h6m6 0h6m-16.78 7.78l4.24-4.24m2.12-2.12l4.24-4.24"></path>
                    </svg>
                </button>
            </header>

            <!-- Study Modes -->
            <div class="study-modes">
                <button class="mode-btn" data-mode="simple" title="Explain in simple terms">
                    <span>Explain Simple</span>
                </button>
                <button class="mode-btn" data-mode="notes" title="Generate short notes">
                    <span>Short Notes</span>
                </button>
                <button class="mode-btn" data-mode="answer" title="Provide long answer">
                    <span>Long Answer</span>
                </button>
                <button class="mode-btn" data-mode="steps" title="Solve step-by-step">
                    <span>Solve Step-by-Step</span>
                </button>
                <button class="mode-btn" data-mode="quiz" title="Generate quiz questions">
                    <span>Quiz Me</span>
                </button>
            </div>

            <!-- Chat Messages Container -->
            <div id="messagesContainer" class="messages-container">
                <div class="welcome-message">
                    <p>Welcome to LearnFlow! Select a study mode above and ask me any study question.</p>
                </div>
            </div>

            <!-- Chat Input Area -->
            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="messageInput" class="message-input" placeholder="Ask me anything..." rows="1"></textarea>
                    <button id="sendBtn" class="send-btn" aria-label="Send message">
                        <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M16.6915026,12.4744748 L3.50612381,13.2599618 C3.19218622,13.2599618 3.03521743,13.4170592 3.03521743,13.5741566 L1.15159189,20.0151496 C0.8376543,20.8006365 0.99,21.89 1.77946707,22.52 C2.41,22.99 3.50612381,23.1 4.13399899,22.8429026 L21.714504,14.0454487 C22.6563168,13.5741566 23.1272231,12.6315722 22.9702544,11.6889879 L4.13399899,1.16001293 C3.34915502,0.9029155 2.40734225,1.00636533 1.77946707,1.4776575 C0.994623095,2.10604706 0.837654326,3.0486314 1.15159189,3.99021575 L3.03521743,10.4311088 C3.03521743,10.5882061 3.19218622,10.7453035 3.50612381,10.7453035 L16.6915026,11.5307905 C16.6915026,11.5307905 17.1624089,11.5307905 17.1624089,12.0020826 C17.1624089,12.4744748 16.6915026,12.4744748 16.6915026,12.4744748 Z"></path>
                        </svg>
                    </button>
                </div>
                <div class="input-hint">Press Enter to send, Shift+Enter for new line</div>
            </div>

            <!-- Clear Chat Button -->
            <button id="clearBtn" class="clear-btn" aria-label="Clear chat">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
            </button>
        </div>

        <!-- Settings Panel -->
        <div id="settingsPanel" class="settings-panel">
            <div class="settings-content">
                <div class="settings-header">
                    <h2>Settings</h2>
                    <button id="closeSettingsBtn" class="close-btn" aria-label="Close settings">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <div class="settings-form">
                    <div class="form-group">
                        <label for="usernameInput">Username</label>
                        <input type="text" id="usernameInput" class="form-input" placeholder="Enter your name">
                    </div>

                    <div class="form-group">
                        <label for="apiKeyInput">API Key</label>
                        <input type="password" id="apiKeyInput" class="form-input" placeholder="Enter your API key">
                        <button id="toggleApiKeyBtn" class="toggle-btn" aria-label="Toggle API key visibility">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>

                    <div class="form-group checkbox">
                        <input type="checkbox" id="animationsToggle" class="form-checkbox">
                        <label for="animationsToggle">Enable animations</label>
                    </div>

                    <button id="deleteHistoryBtn" class="delete-history-btn">Delete Chat History</button>
                    <button id="saveSettingsBtn" class="save-settings-btn">Save Settings</button>
                </div>
            </div>
        </div>

        <!-- Settings Overlay -->
        <div id="settingsOverlay" class="settings-overlay"></div>

        <!-- Error Panel -->
        <div id="errorPanel" class="error-panel">
            <div class="error-content">
                <p id="errorMessage"></p>
                <button id="closeErrorBtn" class="close-error-btn">Close</button>
            </div>
        </div>

        <!-- API Key Missing Panel -->
        <div id="apiKeyMissingPanel" class="api-key-missing-panel">
            <div class="missing-content">
                <p>Please enter your API key in settings</p>
                <button id="openSettingsFromMissingBtn" class="open-settings-btn">Open Settings</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
